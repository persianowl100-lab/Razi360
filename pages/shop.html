<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فروشگاه | رازی ۳۶۰</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Vazirmatn", sans-serif;
      background: #1a140c;
      color: #f7efe2;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(22, 18, 10, 0.75);
      border-radius: 60px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 170, 40, 0.25);
      margin-bottom: 30px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #f7efe2;
      font-weight: 900;
      font-size: 1.5rem;
    }
    .logo i {
      color: #ffb347;
      font-size: 2rem;
    }
    .logo span {
      background: linear-gradient(to left, #ffd166, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back-btn {
      color: #cdb088;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 180, 60, 0.2);
      transition: 0.3s;
    }
    .back-btn:hover {
      background: rgba(255, 180, 60, 0.1);
      color: #ffb347;
    }
    .page-title {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(to left, #ffd166, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin: 30px 0;
    }
    .product-card {
      background: rgba(40, 30, 18, 0.6);
      border-radius: 24px;
      padding: 25px 20px;
      border: 1px solid rgba(255, 180, 60, 0.15);
      transition: 0.3s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-5px);
      border-color: #ffb347;
    }
    .product-icon {
      font-size: 2.5rem;
      color: #ffb347;
    }
    .product-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin: 10px 0 5px;
    }
    .product-price {
      font-size: 1.3rem;
      font-weight: 900;
      color: #ffb347;
      margin: 10px 0;
    }
    .add-to-cart {
      background: #ffa726;
      color: #1a140c;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    .add-to-cart:hover {
      transform: scale(1.03);
    }
    .add-to-cart.in-cart {
      background: #4caf50;
      color: #fff;
    }
    .cart-toggle {
      position: fixed;
      bottom: 30px;
      left: 30px;
      background: #ffa726;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 1.5rem;
      color: #1a140c;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 170, 40, 0.4);
      z-index: 999;
    }
    .cart-toggle .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: red;
      color: #fff;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 0.7rem;
    }
    .cart-sidebar {
      position: fixed;
      top: 0;
      left: -400px;
      width: 380px;
      height: 100vh;
      background: #1a140c;
      border-right: 2px solid rgba(255, 180, 60, 0.2);
      padding: 25px;
      transition: 0.4s;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .cart-sidebar.open {
      left: 0;
    }
    .cart-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
    }
    .cart-overlay.show {
      display: block;
    }
    .cart-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 180, 60, 0.2);
      padding-bottom: 15px;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 180, 60, 0.05);
    }
    .cart-total {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 180, 60, 0.2);
      padding-top: 15px;
    }
    .btn-checkout {
      width: 100%;
      background: #ffa726;
      color: #1a140c;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.1rem;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-checkout:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .login-required {
      background: rgba(255, 167, 38, 0.1);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      color: #ffb347;
      margin-bottom: 10px;
    }
    .login-required a {
      color: #ffb347;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      .cart-sidebar {
        width: 100%;
        left: -100%;
      }
    }
  </style>
</head>
<body>

  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>🛒 سبد خرید</h3>
      <button id="closeCartBtn" style="background:none;border:none;color:#fff;font-size:1.5rem;">✕</button>
    </div>
    <div id="loginRequired" class="login-required" style="display:none;">
      <i class="fas fa-info-circle"></i>
      برای پرداخت <a href="login.html">وارد حساب</a> شوید.
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total">
      <span>جمع کل</span>
      <span id="cartTotal">۰ ریال</span>
    </div>
    <button class="btn-checkout" id="checkoutBtn" disabled>
      <i class="fas fa-credit-card"></i> پرداخت
    </button>
  </div>

  <button class="cart-toggle" id="cartToggle">
    <i class="fas fa-shopping-cart"></i>
    <span class="badge" id="cartBadge">0</span>
  </button>

  <div class="container">
    <header>
      <a href="../index.html" class="logo"><i class="fas fa-brain"></i><span>رازی ۳۶۰</span></a>
      <a href="../index.html" class="back-btn">بازگشت</a>
    </header>
    <h1 class="page-title">🛍️ فروشگاه</h1>
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <script>
    // ─── محصولات ──────────────────────────────
    const products = [
      { id: 1, icon: "fa-robot", title: "مبانی هوش مصنوعی", price: 250000 },
      { id: 2, icon: "fa-comment-dots", title: "ChatGPT و پرامپت", price: 180000 },
      { id: 3, icon: "fa-search", title: "راهنمای DeepSeek", price: 150000 },
      { id: 4, icon: "fa-credit-card", title: "اکانت ChatGPT", price: 89000 },
      { id: 5, icon: "fa-balance-scale", title: "وکیل آنلاین", price: 350000 },
      { id: 6, icon: "fa-code", title: "پرامپت تخصصی", price: 99000 },
    ];

    let cart = JSON.parse(localStorage.getItem("razi360_cart") || "[]");

    function saveCart() {
      localStorage.setItem("razi360_cart", JSON.stringify(cart));
      renderCart();
      updateButtons();
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const exist = cart.find(x => x.id === id);
      if (exist) exist.quantity++;
      else cart.push({ ...p, quantity: 1 });
      saveCart();
    }

    function removeItem(id) {
      cart = cart.filter(x => x.id !== id);
      saveCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(x => x.id === id);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) removeItem(id);
      else saveCart();
    }

    function getTotal() {
      return cart.reduce((s, i) => s + i.price * i.quantity, 0);
    }

    function getCount() {
      return cart.reduce((s, i) => s + i.quantity, 0);
    }

    // ─── رندر ──────────────────────────────────
    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-icon"><i class="fas ${p.icon}"></i></div>
          <div class="product-title">${p.title}</div>
          <div class="product-price">${p.price.toLocaleString()} ریال</div>
          <button class="add-to-cart" data-id="${p.id}" onclick="addToCart(${p.id})">
            <i class="fas fa-plus"></i> افزودن
          </button>
        </div>
      `).join("");
      updateButtons();
    }

    function updateButtons() {
      document.querySelectorAll(".add-to-cart").forEach(btn => {
        const id = +btn.dataset.id;
        if (cart.some(x => x.id === id)) {
          btn.classList.add("in-cart");
          btn.innerHTML = '<i class="fas fa-check"></i> در سبد';
        } else {
          btn.classList.remove("in-cart");
          btn.innerHTML = '<i class="fas fa-plus"></i> افزودن';
        }
      });
    }

    function renderCart() {
      const container = document.getElementById("cartItems");
      const totalEl = document.getElementById("cartTotal");
      const badge = document.getElementById("cartBadge");
      const checkoutBtn = document.getElementById("checkoutBtn");
      const loginReq = document.getElementById("loginRequired");

      const loggedIn = typeof window.isLoggedIn === "function" && window.isLoggedIn();

      if (cart.length === 0) {
        container.innerHTML = "<p style='color:#888;text-align:center;margin-top:30px;'>سبد خرید خالی است</p>";
        totalEl.textContent = "۰ ریال";
        badge.textContent = "0";
        checkoutBtn.disabled = true;
        loginReq.style.display = "none";
        return;
      }

      badge.textContent = getCount();
      checkoutBtn.disabled = !loggedIn;
      loginReq.style.display = loggedIn ? "none" : "block";

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.title} (${item.quantity})</span>
          <span>
            <button onclick="changeQty(${item.id},-1)">-</button>
            <button onclick="changeQty(${item.id},1)">+</button>
            <button onclick="removeItem(${item.id})" style="color:red;">✕</button>
          </span>
        </div>
      `).join("");

      totalEl.textContent = getTotal().toLocaleString() + " ریال";
    }

    // ─── پرداخت ──────────────────────────────────
    function processPayment() {
      if (cart.length === 0) {
        alert("سبد خرید خالی است");
        return;
      }

      if (typeof window.isLoggedIn === "function" && !window.isLoggedIn()) {
        if (confirm("برای پرداخت باید وارد شوید. به صفحه ورود بروید؟")) {
          localStorage.setItem("razi360_redirect_after_login", location.pathname);
          location.href = "login.html";
        }
        return;
      }

      const total = getTotal();
      const orderId = Date.now();

      import("../js/payment.js")
        .then(module => module.initiatePayment(orderId, total, "خرید از رازی‌۳۶۰"))
        .catch(err => {
          console.error("❌ خطا:", err);
          alert("خطا در اتصال به درگاه: " + err.message);
          document.getElementById("checkoutBtn").disabled = false;
          document.getElementById("checkoutBtn").innerHTML = '<i class="fas fa-credit-card"></i> پرداخت';
        });
    }

    // ─── رویدادها ──────────────────────────────
    document.addEventListener("DOMContentLoaded", function() {
      renderProducts();
      renderCart();

      document.getElementById("cartToggle").onclick = () => {
        document.getElementById("cartSidebar").classList.toggle("open");
        document.getElementById("cartOverlay").classList.toggle("show");
      };
      document.getElementById("closeCartBtn").onclick = () => {
        document.getElementById("cartSidebar").classList.remove("open");
        document.getElementById("cartOverlay").classList.remove("show");
      };
      document.getElementById("cartOverlay").onclick = () => {
        document.getElementById("cartSidebar").classList.remove("open");
        document.getElementById("cartOverlay").classList.remove("show");
      };
      document.getElementById("checkoutBtn").onclick = processPayment;
    });

    window.addToCart = addToCart;
    window.removeItem = removeItem;
    window.changeQty = changeQty;
    window.processPayment = processPayment;
  </script>

  <script type="module">
    import { isLoggedIn, getUser } from "../js/auth.js";
    window.isLoggedIn = isLoggedIn;
    window.getUser = getUser;
    renderCart();
    console.log("✅ auth متصل شد، وضعیت لاگین:", isLoggedIn());
  </script>
</body>
</html>
