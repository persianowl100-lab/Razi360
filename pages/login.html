<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- جلوگیری از کش کردن صفحات احراز هویت -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>ورود | رازی ۳۶۰</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(145deg, #1a140c 0%, #241e14 40%, #2b2113 100%);
      color: #f7efe2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-container {
      max-width: 450px;
      width: 100%;
      padding: 40px 30px;
      background: rgba(30, 24, 16, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      border: 1px solid rgba(255, 180, 60, 0.3);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .login-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(to left, #ffd166, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }
    .login-title i {
      -webkit-text-fill-color: #ffb347;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cdb088;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 15px;
      border: 2px solid rgba(255, 180, 60, 0.2);
      background: rgba(255,255,255,0.05);
      color: #f7efe2;
      font-size: 1.1rem;
      font-family: 'Vazirmatn', sans-serif;
      transition: all 0.3s;
      direction: ltr;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ffb347;
      box-shadow: 0 0 20px rgba(255, 167, 38, 0.2);
    }
    .form-group input::placeholder {
      color: #6a5f4a;
    }
    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #ffa726, #f57c00);
      color: #1e140a;
      font-weight: 800;
      font-size: 1.1rem;
      font-family: 'Vazirmatn', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(245, 124, 0, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-success {
      width: 100%;
      padding: 16px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      font-family: 'Vazirmatn', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-success:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
    }
    .btn-success:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      margin: 15px 0;
      font-weight: 500;
      text-align: center;
      display: none;
    }
    .message.show {
      display: block;
    }
    .message-success {
      background: rgba(76, 175, 80, 0.15);
      color: #81C784;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }
    .message-error {
      background: rgba(255, 80, 80, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(255, 80, 80, 0.3);
    }
    .message-info {
      background: rgba(255, 167, 38, 0.15);
      color: #ffb347;
      border: 1px solid rgba(255, 167, 38, 0.3);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: #6a5f4a;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 180, 60, 0.2);
    }
    .divider span {
      padding: 0 15px;
      font-size: 0.9rem;
    }
    .telegram-section {
      margin-top: 10px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #cdb088;
      text-decoration: none;
      transition: 0.3s;
    }
    .back-link:hover {
      color: #ffb347;
    }
    .otp-section {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    .otp-section.show {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .connection-status {
      text-align: center;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .status-online {
      background: rgba(76, 175, 80, 0.1);
      color: #81C784;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .status-offline {
      background: rgba(255, 80, 80, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255, 80, 80, 0.2);
    }
    .status-loading {
      background: rgba(255, 167, 38, 0.1);
      color: #ffb347;
      border: 1px solid rgba(255, 167, 38, 0.2);
    }

    /* تایمر */
    .timer-text {
      display: block;
      text-align: center;
      font-size: 0.85rem;
      color: #ffb347;
      margin-top: 8px;
      font-weight: 600;
      direction: ltr;
    }
    .timer-text i {
      margin-left: 5px;
    }

    /* اوورلی موفقیت */
    .success-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .success-overlay.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }
    .success-overlay i {
      font-size: 5rem;
      color: #4CAF50;
      margin-bottom: 20px;
      animation: bounce 0.8s ease;
    }
    .success-overlay h2 {
      color: #f7efe2;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .success-overlay p {
      color: #cdb088;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- اوورلی موفقیت -->
  <div id="successOverlay" class="success-overlay">
    <i class="fas fa-check-circle"></i>
    <h2>✅ ورود موفقیت‌آمیز!</h2>
    <p>در حال انتقال به پروفایل...</p>
  </div>

  <div class="login-container">
    <h1 class="login-title"><i class="fas fa-brain"></i> رازی ۳۶۰</h1>
    
    <div id="connectionStatus" class="connection-status status-loading">
      ⏳ در حال بررسی اتصال به سرور...
    </div>

    <form id="loginForm" onsubmit="return false;">
      <!-- شماره موبایل -->
      <div class="form-group">
        <label><i class="fas fa-phone"></i> شماره موبایل</label>
        <input 
          type="tel" 
          id="phoneInput" 
          placeholder="مثلاً ۰۹۱۲۳۴۵۶۷۸۹" 
          maxlength="11"
          dir="ltr"
          autocomplete="tel"
        >
      </div>

      <!-- دکمه ارسال کد -->
      <button 
        type="button" 
        id="sendOtpBtn" 
        class="btn-primary" 
        onclick="handleSendOtp()"
        disabled
      >
        <i class="fas fa-paper-plane"></i> ارسال کد تأیید
      </button>
      
      <!-- تایمر -->
      <div id="timerDisplay" class="timer-text" style="display:none;">
        <i class="fas fa-clock"></i>
        <span id="timerSeconds">60</span> ثانیه تا ارسال مجدد
      </div>

      <!-- بخش OTP -->
      <div id="otpSection" class="otp-section">
        <div class="form-group" style="margin-top:20px;">
          <label><i class="fas fa-key"></i> کد تأیید ۶ رقمی</label>
          <input 
            type="text" 
            id="otpCode" 
            placeholder="کد ۶ رقمی" 
            maxlength="6"
            dir="ltr"
            autocomplete="one-time-code"
          >
        </div>
        <button 
          type="button" 
          id="verifyOtpBtn" 
          class="btn-success" 
          onclick="handleVerifyOtp()"
        >
          <i class="fas fa-check-circle"></i> تأیید و ورود
        </button>
      </div>

      <!-- پیام‌ها -->
      <div id="message" class="message"></div>

      <!-- خط جداکننده -->
      <div class="divider"><span>یا</span></div>

      <!-- دکمه تلگرام -->
      <div id="telegram-login-container" class="telegram-section"></div>
    </form>

    <a href="../index.html" class="back-link">
      <i class="fas fa-arrow-right"></i> بازگشت به صفحه اصلی
    </a>
  </div>

  <script type="module">
    import { 
      sendOtp, 
      verifyOtp, 
      renderTelegramButton, 
      testConnection,
      isLoggedIn,
      getUser,
      logout,
      checkAuthStatus,
      autoLoginCheck
    } from "../js/auth.js";

    // ─── المنت‌ها ──────────────────────────────────────
    const connectionStatus = document.getElementById('connectionStatus');
    const phoneInput = document.getElementById('phoneInput');
    const otpCode = document.getElementById('otpCode');
    const sendBtn = document.getElementById('sendOtpBtn');
    const verifyBtn = document.getElementById('verifyOtpBtn');
    const otpSection = document.getElementById('otpSection');
    const messageEl = document.getElementById('message');
    const successOverlay = document.getElementById('successOverlay');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerSeconds = document.getElementById('timerSeconds');

    // ─── متغیرهای تایمر ──────────────────────────────
    let timerInterval = null;

    // ─── نمایش پیام ──────────────────────────────────
    function showMessage(text, type = 'info') {
      messageEl.className = `message show message-${type}`;
      messageEl.textContent = text;
    }

    function hideMessage() {
      messageEl.className = 'message';
      messageEl.textContent = '';
    }

    // ─── نمایش تایمر ──────────────────────────────────
    function showTimer(seconds) {
      timerDisplay.style.display = 'block';
      timerSeconds.textContent = seconds;
      
      sendBtn.disabled = true;
      
      let remaining = seconds;
      
      if (timerInterval) {
        clearInterval(timerInterval);
      }
      
      timerInterval = setInterval(() => {
        remaining--;
        timerSeconds.textContent = remaining;
        
        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          timerDisplay.style.display = 'none';
          sendBtn.disabled = false;
          sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال مجدد کد';
        }
      }, 1000);
    }

    // ─── بررسی وضعیت اتصال ──────────────────────────
    async function checkConnection() {
      connectionStatus.className = 'connection-status status-loading';
      connectionStatus.textContent = '⏳ در حال بررسی اتصال به سرور...';
      sendBtn.disabled = true;

      const result = await testConnection();
      
      if (result.success) {
        connectionStatus.className = 'connection-status status-online';
        connectionStatus.innerHTML = '✅ اتصال به سرور برقرار است';
        sendBtn.disabled = false;
      } else {
        connectionStatus.className = 'connection-status status-offline';
        connectionStatus.innerHTML = '❌ اتصال به سرور برقرار نیست. لطفاً بعداً تلاش کنید.';
        sendBtn.disabled = true;
        showMessage('⚠️ اتصال به سرور برقرار نیست. آدرس API را بررسی کنید.', 'error');
      }
    }

    // ─── ارسال کد ────────────────────────────────────
    window.handleSendOtp = async function() {
      const phone = phoneInput.value.replace(/\D/g, '');

      if (!phone || phone.length < 10) {
        showMessage('❌ شماره موبایل را به درستی وارد کنید (مثلاً ۰۹۱۲۳۴۵۶۷۸۹)', 'error');
        phoneInput.focus();
        return;
      }

      try {
        hideMessage();
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ارسال...';
        showMessage('⏳ در حال ارسال کد تأیید...', 'info');

        const result = await sendOtp(phone);
        console.log('📥 نتیجه:', result);

        if (result.success) {
          showMessage('✅ کد تأیید به شماره شما ارسال شد. لطفاً صندوق پیامک خود را بررسی کنید.', 'success');
          otpSection.classList.add('show');
          otpCode.focus();
          
          // شروع تایمر ۶۰ ثانیه‌ای
          showTimer(60);
          
        } else {
          showMessage('❌ ' + (result.message || 'خطا در ارسال کد'), 'error');
          sendBtn.disabled = false;
          sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال کد تأیید';
        }
      } catch (error) {
        console.error('❌ خطا:', error);
        showMessage('❌ خطا: ' + error.message, 'error');
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال کد تأیید';
      }
    };

    // ─── تأیید کد ────────────────────────────────────
    window.handleVerifyOtp = async function() {
      const phone = phoneInput.value.replace(/\D/g, '');
      const code = otpCode.value.trim();

      if (!code || code.length !== 6) {
        showMessage('❌ کد ۶ رقمی را وارد کنید', 'error');
        otpCode.focus();
        return;
      }

      try {
        hideMessage();
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال تأیید...';
        showMessage('⏳ در حال تأیید کد...', 'info');

        const result = await verifyOtp(phone, code);
        console.log('📥 نتیجه تأیید:', result);

        if (result.success) {
          successOverlay.classList.add('show');
          
          setTimeout(() => {
            window.location.href = 'profile.html';
          }, 1500);
          
        } else {
          showMessage('❌ ' + (result.message || 'کد اشتباه است یا منقضی شده است'), 'error');
          otpCode.value = '';
          otpCode.focus();
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> تأیید و ورود';
        }
      } catch (error) {
        console.error('❌ خطا:', error);
        showMessage('❌ خطا: ' + error.message, 'error');
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> تأیید و ورود';
      }
    };

    // ─── ورود با تلگرام ──────────────────────────────
    function handleTelegramSuccess(user) {
      console.log('✅ ورود با تلگرام موفق:', user);
      successOverlay.classList.add('show');
      setTimeout(() => {
        window.location.href = 'profile.html';
      }, 1500);
    }

    // ─── رویدادهای صفحه ──────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      // ✅ بررسی اعتبار توکن قبل از هر چیز
      const status = await checkAuthStatus();
      
      if (status.valid && status.user) {
        window.location.href = 'profile.html';
        return;
      }

      if (isLoggedIn() && !status.valid) {
        logout();
      }

      await checkConnection();
      renderTelegramButton('telegram-login-container', handleTelegramSuccess);

      phoneInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!sendBtn.disabled) {
            sendBtn.click();
          }
        }
      });

      otpCode.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!verifyBtn.disabled) {
            verifyBtn.click();
          }
        }
      });

      setTimeout(() => phoneInput.focus(), 500);
    });

    // ✅ هنگام رفرش، دوباره بررسی کن
    window.addEventListener('pageshow', async (event) => {
      if (event.persisted) {
        const status = await checkAuthStatus();
        if (status.valid) {
          window.location.href = 'profile.html';
        }
      }
    });

    // ─── بستن اوورلی با کلیک ──────────────────────────
    successOverlay.addEventListener('click', () => {
      window.location.href = 'profile.html';
    });
  </script>

</body>
</html>
