<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | رازی ۳۶۰</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(145deg, #1a140c 0%, #241e14 40%, #2b2113 100%);
      color: #f7efe2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-container {
      max-width: 450px;
      width: 100%;
      padding: 40px 30px;
      background: rgba(30, 24, 16, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      border: 1px solid rgba(255, 180, 60, 0.3);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .login-title {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(to left, #ffd166, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }
    .login-title i {
      -webkit-text-fill-color: #ffb347;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #cdb088;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 15px;
      border: 2px solid rgba(255, 180, 60, 0.2);
      background: rgba(255,255,255,0.05);
      color: #f7efe2;
      font-size: 1.1rem;
      font-family: 'Vazirmatn', sans-serif;
      transition: all 0.3s;
      direction: ltr;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ffb347;
      box-shadow: 0 0 20px rgba(255, 167, 38, 0.2);
    }
    .form-group input::placeholder {
      color: #6a5f4a;
    }
    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #ffa726, #f57c00);
      color: #1e140a;
      font-weight: 800;
      font-size: 1.1rem;
      font-family: 'Vazirmatn', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(245, 124, 0, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-success {
      width: 100%;
      padding: 16px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      font-family: 'Vazirmatn', sans-serif;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-success:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
    }
    .btn-success:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      margin: 15px 0;
      font-weight: 500;
      text-align: center;
    }
    .message-success {
      background: rgba(76, 175, 80, 0.15);
      color: #81C784;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }
    .message-error {
      background: rgba(255, 80, 80, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(255, 80, 80, 0.3);
    }
    .message-info {
      background: rgba(255, 167, 38, 0.15);
      color: #ffb347;
      border: 1px solid rgba(255, 167, 38, 0.3);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: #6a5f4a;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 180, 60, 0.2);
    }
    .divider span {
      padding: 0 15px;
      font-size: 0.9rem;
    }
    .telegram-section {
      margin-top: 10px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #cdb088;
      text-decoration: none;
      transition: 0.3s;
    }
    .back-link:hover {
      color: #ffb347;
    }
    .otp-section {
      display: none;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .connection-status {
      text-align: center;
      font-size: 0.85rem;
      padding: 8px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .status-online {
      background: rgba(76, 175, 80, 0.1);
      color: #81C784;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .status-offline {
      background: rgba(255, 80, 80, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255, 80, 80, 0.2);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1 class="login-title"><i class="fas fa-brain"></i> رازی ۳۶۰</h1>
    
    <div id="connectionStatus" class="connection-status status-offline">
      ⏳ در حال بررسی اتصال به سرور...
    </div>

    <form id="loginForm" onsubmit="return false;">
      <!-- شماره موبایل -->
      <div class="form-group">
        <label><i class="fas fa-phone"></i> شماره موبایل</label>
        <input 
          type="tel" 
          id="phoneInput" 
          placeholder="مثلاً ۰۹۱۲۳۴۵۶۷۸۹" 
          maxlength="11"
          dir="ltr"
        >
      </div>

      <!-- دکمه ارسال کد -->
      <button 
        type="button" 
        id="sendOtpBtn" 
        class="btn-primary" 
        onclick="handleSendOtp()"
      >
        <i class="fas fa-paper-plane"></i> ارسال کد تأیید
      </button>

      <!-- بخش OTP -->
      <div id="otpSection" class="otp-section">
        <div class="form-group" style="margin-top:20px;">
          <label><i class="fas fa-key"></i> کد تأیید ۶ رقمی</label>
          <input 
            type="text" 
            id="otpCode" 
            placeholder="کد ۶ رقمی" 
            maxlength="6"
            dir="ltr"
          >
        </div>
        <button 
          type="button" 
          id="verifyOtpBtn" 
          class="btn-success" 
          onclick="handleVerifyOtp()"
        >
          <i class="fas fa-check-circle"></i> تأیید و ورود
        </button>
      </div>

      <!-- پیام‌ها -->
      <div id="message" class="message" style="display:none;"></div>

      <!-- خط جداکننده -->
      <div class="divider"><span>یا</span></div>

      <!-- دکمه تلگرام -->
      <div id="telegram-login-container" class="telegram-section"></div>
    </form>

    <a href="../index.html" class="back-link">
      <i class="fas fa-arrow-right"></i> بازگشت به صفحه اصلی
    </a>
  </div>

  <script type="module">
    import { 
      sendOtp, 
      verifyOtp, 
      renderTelegramButton, 
      testConnection,
      isLoggedIn,
      getUser 
    } from "../js/auth.js";

    // ─── نمایش پیام ──────────────────────────────────
    function showMessage(text, type = 'info') {
      const el = document.getElementById('message');
      el.style.display = 'block';
      el.textContent = text;
      el.className = `message message-${type}`;
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }

    // ─── بررسی وضعیت اتصال ──────────────────────────
    async function checkConnection() {
      const statusEl = document.getElementById('connectionStatus');
      const result = await testConnection();
      
      if (result.success) {
        statusEl.className = 'connection-status status-online';
        statusEl.innerHTML = '✅ اتصال به سرور برقرار است';
        document.getElementById('sendOtpBtn').disabled = false;
      } else {
        statusEl.className = 'connection-status status-offline';
        statusEl.innerHTML = '❌ اتصال به سرور برقرار نیست. لطفاً بعداً تلاش کنید.';
        document.getElementById('sendOtpBtn').disabled = true;
        showMessage('⚠️ اتصال به سرور برقرار نیست. آدرس API را بررسی کنید.', 'error');
      }
    }

    // ─── ارسال کد ────────────────────────────────────
    window.handleSendOtp = async function() {
      const phoneInput = document.getElementById('phoneInput');
      const sendBtn = document.getElementById('sendOtpBtn');
      const phone = phoneInput.value.replace(/\D/g, '');

      // اعتبارسنجی
      if (!phone || phone.length < 10) {
        showMessage('❌ شماره موبایل را به درستی وارد کنید (مثلاً ۰۹۱۲۳۴۵۶۷۸۹)', 'error');
        phoneInput.focus();
        return;
      }

      try {
        hideMessage();
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ارسال...';
        showMessage('⏳ در حال ارسال کد تأیید...', 'info');

        const result = await sendOtp(phone);
        console.log('📥 نتیجه:', result);

        if (result.success) {
          showMessage('✅ کد تأیید به شماره شما ارسال شد. لطفاً صندوق پیامک خود را بررسی کنید.', 'success');
          document.getElementById('otpSection').style.display = 'block';
          document.getElementById('otpCode').focus();
        } else {
          showMessage('❌ ' + (result.message || 'خطا در ارسال کد'), 'error');
        }
      } catch (error) {
        console.error('❌ خطا:', error);
        showMessage('❌ خطا: ' + error.message, 'error');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال کد تأیید';
      }
    };

    // ─── تأیید کد ────────────────────────────────────
    window.handleVerifyOtp = async function() {
      const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
      const code = document.getElementById('otpCode').value.trim();
      const verifyBtn = document.getElementById('verifyOtpBtn');

      if (!code || code.length !== 6) {
        showMessage('❌ کد ۶ رقمی را وارد کنید', 'error');
        document.getElementById('otpCode').focus();
        return;
      }

      try {
        hideMessage();
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال تأیید...';
        showMessage('⏳ در حال تأیید کد...', 'info');

        const result = await verifyOtp(phone, code);
        console.log('📥 نتیجه تأیید:', result);

        if (result.success) {
          showMessage('✅ ورود موفقیت‌آمیز! در حال انتقال به پروفایل...', 'success');
          setTimeout(() => {
            window.location.href = '../profile.html';
          }, 1500);
        } else {
          showMessage('❌ ' + (result.message || 'کد اشتباه است یا منقضی شده است'), 'error');
          document.getElementById('otpCode').value = '';
          document.getElementById('otpCode').focus();
        }
      } catch (error) {
        console.error('❌ خطا:', error);
        showMessage('❌ خطا: ' + error.message, 'error');
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> تأیید و ورود';
      }
    };

    // ─── ورود با تلگرام ──────────────────────────────
    function handleTelegramSuccess(user) {
      console.log('✅ ورود با تلگرام موفق:', user);
      showMessage('✅ ورود با تلگرام موفقیت‌آمیز!', 'success');
      setTimeout(() => {
        window.location.href = '../profile.html';
      }, 1500);
    }

    // ─── رویدادهای صفحه ──────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      // اگر قبلاً لاگین است، به پروفایل برو
      if (isLoggedIn()) {
        const user = getUser();
        if (user) {
          window.location.href = '../profile.html';
          return;
        }
      }

      // بررسی اتصال
      await checkConnection();

      // رندر دکمه تلگرام
      renderTelegramButton('telegram-login-container', handleTelegramSuccess);

      // رویداد Enter برای فیلدها
      document.getElementById('phoneInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('sendOtpBtn').click();
        }
      });

      document.getElementById('otpCode').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('verifyOtpBtn').click();
        }
      });
    });
  </script>

</body>
</html>
