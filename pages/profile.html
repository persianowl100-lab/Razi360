<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل کاربری | رازی ۳۶۰</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(145deg, #1a140c, #241e14);
      color: #f7efe2;
      min-height: 100vh;
      line-height: 1.7;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px; margin: 20px auto 0; border-radius: 60px;
      background: rgba(22, 18, 10, 0.75); backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 170, 40, 0.25);
      max-width: 900px;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon { font-size: 2.2rem; color: #ffb347; }
    .logo-text {
      font-size: 1.7rem; font-weight: 900;
      background: linear-gradient(to left, #ffd166, #f4a261);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-item {
      text-decoration: none; color: #f5e1c0; font-weight: 600;
      padding: 10px 18px; border-radius: 40px; transition: 0.3s;
    }
    .nav-item:hover { color: #ffb347; background: rgba(255,160,30,0.1); }

    .profile-card {
      margin: 50px auto;
      background: rgba(40, 30, 18, 0.6);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 180, 60, 0.25);
      border-radius: 28px;
      padding: 40px 35px;
      text-align: center;
    }
    .avatar {
      width: 100px; height: 100px; border-radius: 50%;
      margin: 0 auto 18px; border: 3px solid #ffb347;
      box-shadow: 0 0 25px rgba(255,167,38,0.3);
      object-fit: cover; background: rgba(255,180,60,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; color: #ffb347;
    }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .name { font-size: 1.5rem; font-weight: 800; color: #ffcd94; margin-bottom: 6px; }
    .meta { color: #cdb088; font-size: 0.95rem; margin-bottom: 8px; }
    .provider-badge {
      display: inline-block; padding: 5px 14px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700; margin-top: 10px;
      background: rgba(255,167,38,0.15); color: #f4a261;
    }
    .actions { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 28px; border-radius: 50px; font-weight: 700;
      font-family: 'Vazirmatn', sans-serif; font-size: 0.95rem;
      cursor: pointer; transition: 0.3s; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-logout {
      background: transparent; border: 1.5px solid rgba(255,80,80,0.5);
      color: #ff8a8a;
    }
    .btn-logout:hover { background: rgba(255,80,80,0.1); }
    .btn-home {
      background: linear-gradient(135deg, #ffa726, #f57c00);
      color: #1a140c; border: none;
    }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,124,0,0.4); }
  </style>
</head>
<body>

  <header class="container">
    <a href="../index.html" class="logo">
      <i class="fas fa-brain logo-icon"></i>
      <span class="logo-text">رازی ۳۶۰</span>
    </a>
    <a href="../index.html" class="nav-item"><i class="fas fa-home"></i> صفحه اصلی</a>
  </header>

  <div class="container">
    <div class="profile-card" id="profile-content">
      <div class="avatar" id="avatar"><i class="fas fa-user"></i></div>
      <div class="name" id="user-name">در حال بارگذاری...</div>
      <div class="meta" id="user-meta"></div>
      <div class="provider-badge" id="provider-badge"></div>

      <div class="actions">
        <a href="../index.html" class="btn btn-home"><i class="fas fa-home"></i> صفحه اصلی</a>
        <button class="btn btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getUser, logout } from "../js/auth.js";

    // اگر لاگین نباشد → برو به صفحه ورود
    if (!requireAuth()) throw new Error("not logged in");

    const user = getUser();

    // نمایش اطلاعات
    document.getElementById("user-name").textContent = user.name || "کاربر";

    let metaText = "";
    if (user.phone) metaText = "۰" + user.phone.slice(2); // نمایش با صفر
    else if (user.username) metaText = "@" + user.username;
    else if (user.telegramId) metaText = "شناسه تلگرام: " + user.telegramId;
    document.getElementById("user-meta").textContent = metaText;

    const providerMap = {
      phone: "ورود با پیامک",
      telegram: "ورود با تلگرام"
    };
    document.getElementById("provider-badge").textContent = providerMap[user.provider] || user.provider;

    // عکس پروفایل تلگرام
    if (user.photoUrl) {
      document.getElementById("avatar").innerHTML = `<img src="${user.photoUrl}" alt="avatar">`;
    }

    window.handleLogout = function () {
      if (confirm("آیا مطمئن هستید که می‌خواهید خارج شوید؟")) {
        logout();
      }
    };
  </script>
</body>
</html>
