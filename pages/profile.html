<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- جلوگیری از کش کردن صفحات احراز هویت -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>پروفایل کاربری | رازی ۳۶۰</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(145deg, #1a140c 0%, #241e14 40%, #2b2113 100%);
      color: #f7efe2;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* هدر */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 25px;
      margin: 20px 0 30px;
      border-radius: 60px;
      background: rgba(22, 18, 10, 0.75);
      backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 170, 40, 0.25);
      box-shadow: 0 20px 35px rgba(255, 140, 0, 0.15);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #f7efe2;
      font-weight: 900;
      font-size: 1.5rem;
    }
    .logo i {
      color: #ffb347;
      font-size: 2rem;
    }
    .logo span {
      background: linear-gradient(to left, #ffd166, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back-btn {
      color: #cdb088;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 180, 60, 0.2);
      transition: 0.3s;
      font-weight: 600;
    }
    .back-btn:hover {
      background: rgba(255, 180, 60, 0.1);
      color: #ffb347;
    }
    
    /* کارت پروفایل */
    .profile-card {
      background: rgba(40, 30, 18, 0.6);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 40px 30px;
      border: 1px solid rgba(255, 180, 60, 0.25);
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      margin-bottom: 30px;
    }
    
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255, 167, 38, 0.3), rgba(245, 124, 0, 0.1));
      border: 3px solid #ffb347;
      font-size: 3rem;
      color: #ffb347;
      box-shadow: 0 0 40px rgba(255, 167, 38, 0.2);
      position: relative;
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    
    .profile-name-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 5px;
    }
    .profile-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff0db;
    }
    .edit-name-btn {
      background: rgba(255, 180, 60, 0.15);
      border: 1px solid rgba(255, 180, 60, 0.2);
      color: #cdb088;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.9rem;
    }
    .edit-name-btn:hover {
      background: rgba(255, 180, 60, 0.25);
      color: #ffb347;
    }
    
    .profile-provider {
      text-align: center;
      color: #cdb088;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }
    .profile-provider span {
      display: inline-block;
      padding: 4px 16px;
      border-radius: 20px;
      background: rgba(255, 167, 38, 0.15);
      color: #f4a261;
      font-weight: 600;
      font-size: 0.8rem;
    }
    
    /* اطلاعات */
    .info-grid {
      display: grid;
      gap: 15px;
      margin: 25px 0;
    }
    .info-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 15px;
      border: 1px solid rgba(255, 180, 60, 0.08);
      transition: 0.3s;
    }
    .info-item:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255, 180, 60, 0.2);
    }
    .info-label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cdb088;
      font-weight: 500;
    }
    .info-label i {
      color: #ffb347;
      width: 20px;
    }
    .info-value {
      color: #f7efe2;
      font-weight: 600;
      direction: ltr;
    }
    
    /* ویرایش نام */
    .edit-name-form {
      display: none;
      margin: 15px 0;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 15px;
      border: 1px solid rgba(255, 180, 60, 0.15);
    }
    .edit-name-form.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .edit-name-form input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid rgba(255, 180, 60, 0.2);
      background: rgba(255,255,255,0.05);
      color: #f7efe2;
      font-size: 1rem;
      font-family: 'Vazirmatn', sans-serif;
      margin-bottom: 10px;
    }
    .edit-name-form input:focus {
      outline: none;
      border-color: #ffb347;
    }
    .edit-name-form .btn-group {
      display: flex;
      gap: 10px;
    }
    .edit-name-form button {
      padding: 10px 25px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Vazirmatn', sans-serif;
      transition: 0.3s;
    }
    .btn-save {
      background: linear-gradient(135deg, #ffa726, #f57c00);
      color: #1e140a;
    }
    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 124, 0, 0.3);
    }
    .btn-cancel {
      background: rgba(255,255,255,0.1);
      color: #cdb088;
    }
    .btn-cancel:hover {
      background: rgba(255,255,255,0.15);
    }
    
    /* دکمه‌ها */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 30px;
    }
    .btn {
      padding: 14px 20px;
      border-radius: 15px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Vazirmatn', sans-serif;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ffa726, #f57c00);
      color: #1e140a;
      box-shadow: 0 8px 25px rgba(245, 124, 0, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(255, 160, 20, 0.5);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ff6b6b, #c0392b);
      color: white;
    }
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(255, 80, 80, 0.4);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid rgba(255, 180, 60, 0.3);
      color: #cdb088;
    }
    .btn-outline:hover {
      background: rgba(255, 180, 60, 0.1);
      border-color: #ffb347;
      color: #ffb347;
    }
    .btn-full {
      grid-column: 1 / -1;
    }
    
    /* سفارشات */
    .orders-section {
      background: rgba(40, 30, 18, 0.6);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 30px;
      border: 1px solid rgba(255, 180, 60, 0.25);
    }
    .orders-section h2 {
      color: #fff0db;
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .orders-section h2 i {
      color: #ffb347;
    }
    .order-item {
      padding: 15px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 15px;
      border: 1px solid rgba(255, 180, 60, 0.08);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-item:last-child {
      margin-bottom: 0;
    }
    .order-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .order-id {
      color: #f7efe2;
      font-weight: 600;
      direction: ltr;
    }
    .order-date {
      color: #cdb088;
      font-size: 0.85rem;
    }
    .order-amount {
      color: #ffb347;
      font-weight: 800;
      direction: ltr;
      font-size: 1.1rem;
    }
    .order-status {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-paid {
      background: rgba(76, 175, 80, 0.2);
      color: #81C784;
    }
    .status-pending {
      background: rgba(255, 167, 38, 0.2);
      color: #ffb347;
    }
    .status-failed {
      background: rgba(255, 80, 80, 0.2);
      color: #ff6b6b;
    }
    
    .no-orders {
      text-align: center;
      color: #cdb088;
      padding: 30px 0;
    }
    .no-orders i {
      font-size: 3rem;
      color: #6a5f4a;
      margin-bottom: 15px;
    }
    
    /* وضعیت */
    .status-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-online {
      background: rgba(76, 175, 80, 0.2);
      color: #81C784;
    }
    
    /* لودینگ */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #cdb088;
    }
    .loading i {
      font-size: 3rem;
      color: #ffb347;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    
    .hidden {
      display: none !important;
    }
    
    /* پیام خطا */
    .error-box {
      text-align: center;
      padding: 40px 20px;
      background: rgba(255, 80, 80, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(255, 80, 80, 0.2);
    }
    .error-box i {
      font-size: 3rem;
      color: #ff6b6b;
      margin-bottom: 15px;
    }
    .error-box h3 {
      color: #ff6b6b;
      margin-bottom: 10px;
    }
    .error-box p {
      color: #cdb088;
    }
    
    @media (max-width: 480px) {
      .actions {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        gap: 10px;
        border-radius: 30px;
      }
      .profile-card {
        padding: 25px 20px;
      }
      .order-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- هدر -->
  <header>
    <a href="../index.html" class="logo">
      <i class="fas fa-brain"></i>
      <span>رازی ۳۶۰</span>
    </a>
    <a href="../index.html" class="back-btn">
      <i class="fas fa-arrow-right"></i> بازگشت
    </a>
  </header>

  <!-- محتوای پروفایل -->
  <div id="profileContent">
    
    <!-- حالت لودینگ -->
    <div id="loadingState" class="loading">
      <i class="fas fa-spinner"></i>
      <p style="margin-top:15px;">در حال بارگذاری اطلاعات...</p>
    </div>

    <!-- حالت خطا -->
    <div id="errorState" class="hidden error-box">
      <i class="fas fa-exclamation-circle"></i>
      <h3>خطا در بارگذاری</h3>
      <p id="errorMessage">مشکلی در دریافت اطلاعات کاربر وجود دارد.</p>
      <a href="login.html" class="btn btn-primary" style="margin-top:20px;display:inline-flex;">
        <i class="fas fa-sign-in-alt"></i> ورود مجدد
      </a>
    </div>

    <!-- حالت پروفایل -->
    <div id="profileState" class="hidden">
      
      <!-- کارت پروفایل -->
      <div class="profile-card">
        
        <!-- آواتار -->
        <div class="profile-avatar" id="profileAvatar">
          <i class="fas fa-user"></i>
        </div>
        
        <!-- نام + دکمه ویرایش -->
        <div class="profile-name-wrapper">
          <h1 class="profile-name" id="profileName">کاربر</h1>
          <button class="edit-name-btn" onclick="toggleEditName()" title="ویرایش نام">
            <i class="fas fa-pen"></i>
          </button>
        </div>
        
        <!-- فرم ویرایش نام -->
        <div class="edit-name-form" id="editNameForm">
          <input type="text" id="newNameInput" placeholder="نام جدید خود را وارد کنید" maxlength="50">
          <div class="btn-group">
            <button class="btn-save" onclick="saveName()">ذخیره</button>
            <button class="btn-cancel" onclick="toggleEditName()">انصراف</button>
          </div>
        </div>
        
        <div class="profile-provider">
          <span id="profileProvider">📱 ورود با موبایل</span>
        </div>
        
        <!-- اطلاعات -->
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label"><i class="fas fa-id-badge"></i> شناسه کاربری</span>
            <span class="info-value" id="profileId">-</span>
          </div>
          <div class="info-item">
            <span class="info-label"><i class="fas fa-phone"></i> شماره موبایل</span>
            <span class="info-value" id="profilePhone">-</span>
          </div>
          <div class="info-item">
            <span class="info-label"><i class="fas fa-calendar-alt"></i> تاریخ عضویت</span>
            <span class="info-value" id="profileDate">-</span>
          </div>
          <div class="info-item">
            <span class="info-label"><i class="fas fa-shield-alt"></i> وضعیت</span>
            <span class="info-value"><span class="status-badge status-online">✅ فعال</span></span>
          </div>
        </div>
        
        <!-- دکمه‌ها -->
        <div class="actions">
          <a href="shop.html" class="btn btn-primary">
            <i class="fas fa-shopping-cart"></i> فروشگاه
          </a>
          <button onclick="handleLogout()" class="btn btn-danger btn-full">
            <i class="fas fa-sign-out-alt"></i> خروج از حساب
          </button>
        </div>
        
      </div>
      
      <!-- بخش سفارشات -->
      <div class="orders-section">
        <h2><i class="fas fa-receipt"></i> سفارشات من</h2>
        <div id="ordersList">
          <div class="no-orders">
            <i class="fas fa-shopping-bag"></i>
            <p>هنوز سفارشی ثبت نکرده‌اید</p>
            <p style="font-size:0.85rem;color:#6a5f4a;">برای مشاهده سفارشات، از فروشگاه خرید کنید</p>
          </div>
        </div>
      </div>
      
    </div>
    
  </div>
</div>

<script type="module">
  import { 
    isLoggedIn, 
    getUser, 
    logout, 
    fetchMe,
    checkAuthStatus,
    saveSession
  } from "../js/auth.js";

  // ─── المنت‌ها ──────────────────────────────────────
  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  const profileState = document.getElementById('profileState');
  const errorMessage = document.getElementById('errorMessage');

  const profileName = document.getElementById('profileName');
  const profileProvider = document.getElementById('profileProvider');
  const profileId = document.getElementById('profileId');
  const profilePhone = document.getElementById('profilePhone');
  const profileDate = document.getElementById('profileDate');
  const profileAvatar = document.getElementById('profileAvatar');
  const editNameForm = document.getElementById('editNameForm');
  const newNameInput = document.getElementById('newNameInput');

  // ─── خروج ──────────────────────────────────────────
  window.handleLogout = function() {
    if (confirm('آیا مطمئن هستید که می‌خواهید خارج شوید؟')) {
      logout();
      window.location.href = '../index.html';
    }
  };

  // ─── ویرایش نام ──────────────────────────────────
  window.toggleEditName = function() {
    editNameForm.classList.toggle('show');
    if (editNameForm.classList.contains('show')) {
      newNameInput.value = profileName.textContent;
      newNameInput.focus();
    }
  };

  window.saveName = function() {
    const newName = newNameInput.value.trim();
    if (!newName || newName.length < 2) {
      alert('نام باید حداقل ۲ کاراکتر باشد');
      return;
    }
    
    // ذخیره در localStorage
    const user = getUser();
    if (user) {
      user.name = newName;
      user.updatedAt = new Date().toISOString();
      
      // به‌روزرسانی در localStorage
      const token = localStorage.getItem('razi360_token');
      if (token) {
        saveSession(token, user);
      }
      
      // به‌روزرسانی نمایش
      profileName.textContent = newName;
      
      // بستن فرم
      editNameForm.classList.remove('show');
      
      // ذخیره در سرور (اختیاری - در نسخه بعدی)
      alert('✅ نام شما با موفقیت تغییر یافت');
    }
  };

  // ─── نمایش پروفایل ────────────────────────────────
  function showProfile(user) {
    // نام
    profileName.textContent = user.name || 'کاربر';
    
    // روش ورود
    const providerMap = {
      'phone': '📱 ورود با موبایل',
      'telegram': '✈️ ورود با تلگرام',
      'google': '🔵 ورود با گوگل'
    };
    profileProvider.textContent = providerMap[user.provider] || '🔐 ورود';

    // شناسه
    profileId.textContent = user.id || '-';
    
    // شماره موبایل
    if (user.phone) {
      const phone = String(user.phone);
      let displayPhone = phone;
      if (phone.startsWith('98')) {
        displayPhone = '0' + phone.slice(2);
      }
      profilePhone.textContent = displayPhone;
    } else {
      profilePhone.textContent = 'ثبت نشده';
    }

    // تاریخ عضویت
    if (user.createdAt) {
      const date = new Date(user.createdAt);
      profileDate.textContent = new Intl.DateTimeFormat('fa-IR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    } else {
      profileDate.textContent = '-';
    }

    // آواتار
    if (user.photoUrl) {
      profileAvatar.innerHTML = `<img src="${user.photoUrl}" alt="${user.name}">`;
    } else if (user.name) {
      const initial = user.name.charAt(0);
      profileAvatar.innerHTML = `<span style="font-size:3rem;color:#ffb347;">${initial}</span>`;
    }

    // نمایش سفارشات
    renderOrders();

    // نمایش پروفایل
    loadingState.classList.add('hidden');
    profileState.classList.remove('hidden');
  }

  // ─── رندر سفارشات ──────────────────────────────────
  function renderOrders() {
    const container = document.getElementById('ordersList');
    const orders = JSON.parse(localStorage.getItem('razi360_orders') || '[]');
    
    if (orders.length === 0) {
      container.innerHTML = `
        <div class="no-orders">
          <i class="fas fa-shopping-bag"></i>
          <p>هنوز سفارشی ثبت نکرده‌اید</p>
          <p style="font-size:0.85rem;color:#6a5f4a;">برای مشاهده سفارشات، از فروشگاه خرید کنید</p>
        </div>
      `;
      return;
    }

    // مرتب‌سازی از جدید به قدیم
    orders.sort((a, b) => new Date(b.date) - new Date(a.date));

    container.innerHTML = orders.map(order => `
      <div class="order-item">
        <div class="order-info">
          <span class="order-id">#${order.orderId}</span>
          <span class="order-date">${new Date(order.date).toLocaleDateString('fa-IR')} - ${new Date(order.date).toLocaleTimeString('fa-IR')}</span>
        </div>
        <div>
          <span class="order-amount">${Number(order.amount).toLocaleString()} ریال</span>
          <span class="order-status status-${order.status || 'paid'}">${order.status === 'paid' ? '✅ پرداخت شده' : '⏳ در انتظار'}</span>
        </div>
      </div>
    `).join('');
  }

  // ─── نمایش خطا ──────────────────────────────────────
  function showError(message) {
    loadingState.classList.add('hidden');
    errorState.classList.remove('hidden');
    errorMessage.textContent = message || 'مشکلی در دریافت اطلاعات کاربر وجود دارد.';
  }

  // ─── بارگذاری پروفایل ──────────────────────────────

  async function loadProfile() {
    // ✅ بررسی اعتبار توکن
    const status = await checkAuthStatus();
    
    if (!status.valid) {
      window.location.href = 'login.html';
      return;
    }

    const user = status.user || getUser();
    
    if (user) {
      showProfile(user);
    } else {
      showError('اطلاعات کاربر یافت نشد. لطفاً مجدداً وارد شوید.');
    }
  }

  // ─── اجرا ──────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', loadProfile);
  
  // ✅ در صورت رفرش، دوباره بررسی کن
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      loadProfile();
    }
  });
</script>

</body>
</html>
