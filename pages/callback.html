<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نتیجه پرداخت | رازی ۳۶۰</title>
  <style>
    body {
      background: #1a140c;
      color: #f7efe2;
      font-family: 'Vazirmatn', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      background: rgba(40, 30, 18, 0.7);
      padding: 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 180, 60, 0.2);
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    .success {
      color: #4caf50;
      font-size: 4rem;
    }
    .fail {
      color: #ff6b6b;
      font-size: 4rem;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #ffa726;
      color: #1a140c;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box" id="resultBox">
    <div id="icon" class="fail">❌</div>
    <h2 id="title">در حال بررسی...</h2>
    <p id="message"></p>
    <a href="../index.html" class="btn">بازگشت به خانه</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const resCode = params.get("ResCode");
    const refId = params.get("RefId");
    const saleOrderId = params.get("SaleOrderId");
    const saleReferenceId = params.get("SaleReferenceId");

    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const msg = document.getElementById("message");

    if (resCode === "0") {
      icon.className = "success";
      icon.textContent = "✅";
      title.textContent = "پرداخت موفق";
      msg.textContent = "سفارش شما ثبت شد.";

      // ذخیره سفارش
      const orders = JSON.parse(localStorage.getItem("razi360_orders") || "[]");
      orders.push({
        orderId: saleOrderId,
        refId: refId,
        amount: params.get("FinalAmount") || "نامشخص",
        date: new Date().toISOString(),
        status: "paid"
      });
      localStorage.setItem("razi360_orders", JSON.stringify(orders));

      // پاک کردن سبد خرید
      localStorage.removeItem("razi360_cart");
    } else {
      icon.className = "fail";
      icon.textContent = "❌";
      title.textContent = "پرداخت ناموفق";
      msg.textContent = "کد خطا: " + resCode;
    }
  </script>
</body>
</html>
